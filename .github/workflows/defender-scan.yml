# Scans the published Windows downloads with Microsoft Defender (up-to-date signatures)
# and reports any detection. Run it from the Actions tab or with: gh workflow run defender-scan.yml
name: Defender scan of published downloads

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: windows-latest
    steps:
      - name: Download the latest public release
        shell: pwsh
        run: |
          $base = 'https://github.com/Yifan-Hu1/literature-screener-app/releases/latest/download'
          New-Item -ItemType Directory -Force scan | Out-Null
          foreach ($f in 'Literature-Screener-windows-setup.exe', 'Literature-Screener-windows-portable.zip') {
            Invoke-WebRequest "$base/$f" -OutFile "scan/$f"
            Get-FileHash "scan/$f" -Algorithm SHA256 | Format-List
          }
          Expand-Archive scan/Literature-Screener-windows-portable.zip -DestinationPath scan/portable
      - name: Update Defender and scan
        shell: pwsh
        run: |
          Get-MpComputerStatus | Select-Object AMProductVersion, AntivirusSignatureVersion, RealTimeProtectionEnabled | Format-List
          Update-MpSignature -ErrorAction Continue
          Get-MpComputerStatus | Select-Object AntivirusSignatureVersion, AntivirusSignatureLastUpdated | Format-List
          & "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File "$PWD\scan" -DisableRemediation
          "Exit code: $LASTEXITCODE (0 = nothing found, 2 = threat found)"
          Get-MpThreatDetection | Format-List
          Get-MpThreat | Format-List ThreatName, SeverityID, Resources
